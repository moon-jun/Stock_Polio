name = 'stock-polio-worker'
main = 'src/index.ts'
compatibility_date = '2024-03-20'

[vars]
ALLOWED_ORIGINS = 'https://moon-jun.github.io'

[[ratelimits]]
name = 'SEARCH_LIMITER'
namespace_id = '1001'
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = 'QUOTE_LIMITER'
namespace_id = '1002'
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = 'FRESH_QUOTE_LIMITER'
namespace_id = '1003'
[ratelimits.simple]
limit = 10
period = 60

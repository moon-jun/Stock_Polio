name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_FIREBASE_API_KEY: 'AIzaSyBX-WZo7pnLRI43RnZYptW60FXY3ayB0kc'
          VITE_FIREBASE_AUTH_DOMAIN: 'planning-with-ai-a3485.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'planning-with-ai-a3485'
          VITE_FIREBASE_APP_ID: '1:303429363708:web:b2df55578c0cf0e3de7479'
          VITE_WORKER_API_URL: ${{ vars.VITE_WORKER_API_URL }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
